name: Daily import-worthiness report

# Regenerates data/import_worthiness_report.json from whatever's currently
# in data/ (cars + all testing verticals) -- see scraper/analysis.py for
# the methodology and its honest limitations (demand proxy, not a profit
# margin; non-car verticals are grouped by subcategory, not brand/model).
#
# Scheduled well after both scrape workflows (verticals 22:00 UTC, cars
# 23:00 UTC) so it's summarizing the day's actual data, not a stale
# snapshot from before they ran -- 03:00 UTC gives both a 2-3 hour margin
# even at their worst-case runtime.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: quietloop-report-daily
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Sync to the current branch tip (guards against a stale checkout if this run queued behind another)
        run: |
          git fetch origin "${{ github.ref_name }}"
          git reset --hard "origin/${{ github.ref_name }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -q

      - name: Generate report
        id: report
        run: |
          set +e
          python -m scraper.analysis
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit and push the report
        if: always()
        run: |
          git config user.name "quietloop-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/import_worthiness_report.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily import-worthiness report: $(date -u +%F)"
            pushed=false
            for attempt in 1 2 3; do
              if git pull --rebase origin "${{ github.ref_name }}" && git push; then
                pushed=true
                break
              fi
              echo "push attempt $attempt failed, retrying in 5s..."
              sleep 5
            done
            if [ "$pushed" = false ]; then
              echo "::error::failed to push after 3 attempts"
              exit 1
            fi
          fi

      - name: Fail the job if report generation didn't succeed
        if: steps.report.outputs.exit_code != '0'
        run: |
          echo "scraper.analysis exited with code ${{ steps.report.outputs.exit_code }} (or never ran)."
          exit 1
